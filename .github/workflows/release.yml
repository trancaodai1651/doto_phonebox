name: release

# Builds every release artifact on GitHub's runners and publishes them with checksums as a GitHub release.
# scripts/release.ps1 dispatches this workflow. Start it from Actions › release › Run workflow after bumping the version.
#
# The APK must be signed with the same key as the app already on the phones, or Android refuses the update. Add the
# key as repository secrets: PHONEBOX_KEYSTORE_BASE64 (base64 of the .jks / .keystore file), PHONEBOX_STORE_PASSWORD,
# PHONEBOX_KEY_ALIAS and PHONEBOX_KEY_PASSWORD. Without them the workflow stops before publishing anything.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read and check the version
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -n1)
          grep -q "versionName = \"$v\"" android/app/build.gradle.kts || { echo "::error::android versionName does not match $v"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "::error::v$v is already released; bump the version first"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check release metadata
        run: python3 tools/check-release.py

  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.PHONEBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::add the PHONEBOX_KEYSTORE_BASE64 secret (see the top of release.yml)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the release APK
        working-directory: android
        env:
          PHONEBOX_STORE_FILE: ${{ runner.temp }}/release.keystore
          PHONEBOX_STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        run: |
          test -n "$PHONEBOX_STORE_PASSWORD"
          test -n "$PHONEBOX_KEY_ALIAS"
          test -n "$PHONEBOX_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew lintRelease assembleRelease --no-daemon --console=plain
          mkdir -p ../dist
          apk="../dist/PhoneBox-${{ needs.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/

  agent:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: windows-11-arm, rid: win-arm64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, tfm: net10.0 }
          - { os: macos-15, rid: osx-arm64, tfm: net10.0 }
          - { os: macos-15-intel, rid: osx-x64, tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath fetches the unsigned agent from this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # Self-contained single file: no .NET runtime to install. Not compressed (the zip is barely smaller and a
      # compressed bundle costs about 90 MB more memory in a process that runs all day); native libraries stay
      # loose next to the exe instead of being extracted to the temp folder at run time.
      - name: Publish (self-contained, single file)
        run: dotnet publish agent/PhoneBox.Agent -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out --nologo
      - name: Sign macOS apphost ad hoc
        if: startsWith(matrix.rid, 'osx-')
        run: codesign --force --sign - out/PhoneBoxAgent
      # Authenticode signing through SignPath Foundation, before the smoke test, the zip, the checksums, the attestation
      # and the Scoop/winget hash, which all cover the signed file. It is on while the repository variable
      # SIGNPATH_SIGNING_POLICY names a policy (release-signing); each request waits for a manual approval in SignPath.
      - name: Sign PhoneBoxAgent.exe (SignPath)
        if: matrix.rid == 'win-x64' && vars.SIGNPATH_SIGNING_POLICY != ''
        uses: ./.github/actions/sign-windows-agent
        with:
          exe: out/PhoneBoxAgent.exe
          signing-policy: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          trusted: ${{ vars.SIGNPATH_SIGNING_POLICY == 'release-signing' }}
      - name: Smoke-test the published agent on its native architecture
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'out/PhoneBoxAgent.exe' } else { 'out/PhoneBoxAgent' }
          python tools/smoke-agent.py $exe --version '${{ needs.version.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "PhoneBoxAgent-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          if ($IsWindows) {
            Compress-Archive -Path out/* -DestinationPath "dist/$zip"
          } else {
            Push-Location out
            zip -qr "../dist/$zip" .
            Pop-Location
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent-${{ matrix.rid }}
          path: dist/

  installer:
    needs: [version, agent]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, prefix: win, ext: exe }
          - { os: macos-15, platform: macos, prefix: osx, ext: pkg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-agent-${{ matrix.prefix }}-*
          merge-multiple: true
          path: archives
      - name: Build the Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          foreach ($rid in 'win-x64', 'win-arm64') {
            Expand-Archive "archives/PhoneBoxAgent-$version-$rid.zip" "payload/$rid"
          }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          & $iscc "/DVersion=$version" packaging/windows/PhoneBox.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the macOS installer
        if: matrix.platform == 'macos'
        run: |
          version='${{ needs.version.outputs.version }}'
          for rid in osx-arm64 osx-x64; do
            mkdir -p "payload/$rid"
            unzip -q "archives/PhoneBoxAgent-$version-$rid.zip" -d "payload/$rid"
          done
          bash packaging/macos/build-pkg.sh "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer-${{ matrix.platform }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error

  test-installer:
    needs: [version, installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: windows-11-arm, platform: windows }
          - { os: macos-15, platform: macos }
          - { os: macos-15-intel, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer-${{ matrix.platform }}
          path: dist
      - name: Install and run on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $setup = "dist/PhoneBox-$version-windows-universal.exe"
          $result = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($result.ExitCode) { throw "Setup failed with exit code $($result.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'PhoneBox/app/PhoneBoxAgent.exe'
          # Check the PE header too: x64 emulation on ARM must not mask incorrect installer selection.
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($exe))
          try {
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadInt32() + 4
            $expected = if (([Runtime.InteropServices.RuntimeInformation]::OSArchitecture) -eq 'Arm64') { 0xaa64 } else { 0x8664 }
            if ($reader.ReadUInt16() -ne $expected) { throw 'Setup installed the wrong architecture' }
          } finally {
            $reader.Dispose()
          }
          python tools/smoke-agent.py $exe --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and run on macOS
        if: matrix.platform == 'macos'
        run: |
          version='${{ needs.version.outputs.version }}'
          sudo installer -pkg "dist/PhoneBox-$version-macos-universal.pkg" -target /
          codesign --verify --deep --strict /Applications/PhoneBox.app
          python3 tools/smoke-agent.py /Applications/PhoneBox.app/Contents/MacOS/PhoneBox --version "$version"

  publish:
    needs: [checks, version, apk, agent, test-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Attest release artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.zip
            dist/*.exe
            dist/*.pkg
      - name: Save the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/PhoneBox-${{ needs.version.outputs.version }}.intoto.jsonl"
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64 osx-x64; do
            test -s "PhoneBoxAgent-$v-$rid.zip"
          done
          test -s "PhoneBox-$v-windows-universal.exe"
          test -s "PhoneBox-$v-macos-universal.pkg"
          test -s "PhoneBox-$v.apk"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 10
          sha256sum * > "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
          cat "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.version.outputs.version }}"
          # the section for this version, else the "Unreleased" one
          section() { awk -v v="$1" '/^## /{ if (on) exit; on = ($2 == v); next } on' CHANGELOG.md; }
          section "$v" > notes.md
          [ -s notes.md ] || section Unreleased > notes.md
          [ -s notes.md ] || echo "PhoneBox $v" > notes.md
          cat >> notes.md <<'EOF'

          | Nền tảng | Bộ cài |
          |---|---|
          | Windows x64 và ARM64 | `PhoneBox-VERSION-windows-universal.exe` |
          | macOS 14 trở lên, Intel và Apple Silicon | `PhoneBox-VERSION-macos-universal.pkg` |
          | Android 5.0 trở lên | `PhoneBox-VERSION.apk` |

          APK được ký bằng khóa của fork. Bộ cài Windows chưa ký Authenticode và bộ cài macOS chưa được Apple công chứng.

          [Hướng dẫn cài đặt và sử dụng](${{ github.server_url }}/${{ github.repository }}/blob/vVERSION/TUY-CHINH.md)
          EOF
          sed -i "s/VERSION/$v/g" notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          gh release create "v$v" dist/* --title "PhoneBox $v" --notes-file notes.md --target "${{ github.sha }}" ${{ inputs.draft && '--draft' || '' }}
